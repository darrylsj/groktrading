[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "groktrading"
version = "0.1.0"
description = "Secret-free GrokTrading reference package: signals-only/paper by default, never live by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GrokTrading contributors" }]
keywords = ["trading", "paper", "signals", "tradier", "finnhub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.6",
]
ws = [
  "websockets>=12,<16",
]

[project.scripts]
groktrading-opening15 = "groktrading.research.cli:main"
groktrading-research-cycle = "groktrading.research.cycle_cli:main"
groktrading-finnhub-probe = "groktrading.cli:finnhub_probe_main"
groktrading-finnhub-tape = "groktrading.cli:finnhub_tape_main"
groktrading-tape = "groktrading.cli:tape_skeleton_main"

[project.urls]
Documentation = "https://github.com/darrylsj/groktrading"
Issues = "https://github.com/darrylsj/groktrading/issues"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/deploy",
  "/scripts",
  "/schemas",
  "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["groktrading", "helpers"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["groktrading"]
mypy_path = "src"
warn_unused_ignores = true
