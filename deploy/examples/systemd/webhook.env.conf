# Drop-in example: load webhook signing env without putting secrets in the unit.
# Default install path (package unit):
#   /etc/systemd/system/groktrading-tape.service.d/webhook.conf
# Legacy Helsinki name (only if the operator adopts it):
#   /etc/systemd/system/trading-desk-tape.service.d/webhook.conf
# Env file: /etc/trading-desk/grok-webhook.env  owner root, mode 0600.
# The installer never overwrites an existing drop-in unless --force-units.

[Service]
EnvironmentFile=-/etc/trading-desk/grok-webhook.env
